name: Tests

# PR gate. Never logs in, never pushes, uses no secrets. Runs the same pytest suite the
# publishing workflow gates on, then builds the image and runs the same smoke, while
# :latest (followed by the `airdropchecker` container in the `crypt-common` stack on
# nebula) stays untouched by PR branches.
on:
  # Manual re-run for runs that flaked on runner networking; safe, nothing is published.
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing is published, so a superseded run is cancelled (unlike image-check-publish.yml).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Same shape as the `test` job in image-check-publish.yml. Outer bound over the 20-minute
    # step; it must exceed the sum, because act_runner kills the whole job when this fires
    # and the cleanup step would not run.
    timeout-minutes: 25
    # Job-level so the create and cleanup steps cannot disagree about the name; the run id
    # keeps concurrent runs on the shared daemon apart.
    env:
      TEST_NAME: airdrop-checker-tests-pr-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python`: setup actions are not verified on this self-hosted runner and
      # can silently check nothing. Running inside a container on the same docker the build
      # uses makes "the tests ran" and "docker works" the same statement.
      timeout-minutes: 20
      env:
        # The same interpreter the Dockerfile ships; requirements-dev.txt pins pytest 8.4.x
        # because pytest 9 requires python >= 3.10.
        RUNTIME_IMAGE: python:3.9-slim
      # This `run:` body is byte-identical to the one in image-check-publish.yml.
      run: |
        set -e
        set -o pipefail
        # A UI re-run reuses github.run_id, so a killed attempt's container may still hold the
        # name; `docker run --name` would fail on the conflict. `-v` drops anonymous volumes.
        docker rm -f -v "$TEST_NAME" || true
        # The workspace goes in as a tar over stdin, not a bind mount: this job runs inside
        # act_runner's container while `docker` talks to the host daemon, so `$PWD` means
        # something else (or nothing) on the host. It also keeps root-owned caches out of the
        # checkout. .dockerignore does not apply to a tar, so exclusions are listed here:
        # `.git` (unused), `.venv` (host wheels for another interpreter), `data/` (runtime
        # state on a workstation), `.env` (src/settings.py reads it via env_file, and a
        # workstation's holds real Grist credentials), and caches from another interpreter.
        # `--pull always`: the daemon is persistent, so a cached base would go stale.
        # The GRIST_* values are placeholders: all HTTP is mocked, tests/conftest.py
        # setdefault()s the same three, and `grist.invalid` (RFC 2606) cannot resolve.
        # `--name` makes the container reachable by the cleanup step: a step timeout kills the
        # docker CLI on the runner, not the container on the host, so `--rm` never fires.
        tar -cf - --exclude=./.git --exclude=./.venv --exclude=./data \
          --exclude=./.env --exclude=./.pytest_cache --exclude=__pycache__ . \
          | docker run --rm -i --pull always --name "$TEST_NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=test-doc \
          -e GRIST_API_KEY=test-key \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

    - name: Remove the test container from the runner
      # `always()`: this matters exactly when the step above failed or timed out and left the
      # container running on the shared daemon. Best-effort so a cleanup error cannot hide the
      # suite's verdict.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: test                          # same ordering as the publishing workflow
    # Same outer bound as image-check-publish.yml. Step timeouts here sum to 30 minutes
    # (20 build + 10 smoke); the bound must stay above that, because a job killed by it may
    # never run its `if: always()` cleanup.
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v7

    - name: Compute the local image tag
      id: tags
      # Local tag with no registry host, so nothing can be pushed; the run id keeps concurrent
      # PR checks on the shared daemon apart.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "local=airdrop-checker-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Same 20-minute step bound as image-check-publish.yml for the same Dockerfile.
      timeout-minutes: 20
      env:
        # Through the environment rather than interpolated into the script text.
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        # --pull: the self-hosted daemon is persistent, so a cached python:3.9-slim would go
        # stale. This is a BuildKit build (the default since Engine 23.0).
        docker build --pull . --file Dockerfile --tag "$LOCAL_TAG"

    - name: Smoke-test the built image
      # The same ci/smoke.py against the same kind of container as image-check-publish.yml,
      # on a local tag with no login and no push. See that file for what the smoke covers,
      # why the image's own command is used, and the 10-minute budget.
      timeout-minutes: 10
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.local }}
        NAME: airdrop-checker-pr-check-${{ github.run_id }}
      # This body is byte-identical to the one in image-check-publish.yml, comments included;
      # only the `env:` values above differ.
      run: |
        # A UI re-run keeps the same run_id, and an attempt killed by its timeout never
        # reaches the cleanup, so the name may still be taken.
        docker rm -f -v "$NAME" || true

        # Placeholder configuration, not credentials: `grist.invalid` (RFC 2606) fails on name
        # resolution, so no wallet list arrives and purrfolio.com is never called. It is needed
        # because the CMD is a direct `python main.py`, which exits within a second on a bare
        # environment; ci/smoke.py strips these again for its fail-loudly check.
        docker run -d --name "$NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=smoke-not-a-real-doc \
          -e GRIST_API_KEY=smoke-not-a-real-key \
          "$SMOKE_TAG"

        # Wait for docker's own health verdict: only this proves docker runs the probe (and the
        # right module path); a HEALTHCHECK that never goes green makes auto-heal restart the
        # container forever. "nohealth" means the image declares no HEALTHCHECK, which fails.
        # 90 attempts two seconds apart is 180 s, three 60 s intervals.
        attempt=0
        state=""
        health=""
        while [ "$attempt" -lt 90 ]; do
          info=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' "$NAME" 2>/dev/null) || info="gone gone"
          state=${info%% *}
          health=${info##* }
          if [ "$state" != "running" ]; then
            echo "container is '$state', not running; logs:"
            docker logs "$NAME" || true
            exit 1
          fi
          if [ "$health" = "nohealth" ]; then
            echo "the image declares no HEALTHCHECK at all — auto-heal would have nothing to act on"
            exit 1
          fi
          if [ "$health" = "healthy" ]; then
            break
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        if [ "$health" != "healthy" ]; then
          echo "container never became healthy (last verdict: '$health'); logs:"
          docker logs "$NAME"
          exit 1
        fi

        # Fed over stdin, so the image need not carry the script and it can be run by hand
        # against a local container. `-u` because stdout is a pipe: a step killed by the
        # timeout would otherwise lose the buffered `ok` lines.
        if ! docker exec -i "$NAME" python -u - < ci/smoke.py; then
          echo "smoke failed; container logs:"
          docker logs "$NAME"
          exit 1
        fi

    - name: Remove the smoke container from the runner
      # `always()`, and before the image cleanup: a leftover container on the shared daemon
      # would stay forever and pin the image, failing the `docker rmi` below.
      if: always()
      env:
        NAME: airdrop-checker-pr-check-${{ github.run_id }}
      run: |
        docker rm -f -v "$NAME" || true

    - name: Remove the built image from the runner
      # Removes only this run's tag; `docker system prune` would hit other repos on the shared
      # daemon. The BuildKit cache and dangling old bases need a separate periodic cleanup.
      if: always()
      env:
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        docker rmi "$LOCAL_TAG" || true
