name: Docker Image CI

# No `pull_request` trigger on purpose: this workflow pushes :latest, the tag production
# follows (the `airdropchecker` container in the `crypt-common` stack on nebula carries
# watchtower labels), and a PR branch must never be able to move it. PRs are covered by
# tests.yml, which runs the same suite and smoke but never logs in or pushes.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# `packages: write` has no effect on Gitea Actions (GITEA_TOKEN has no package scope); the
# push authenticates with the REGISTRY_TOKEN PAT, an org-level secret on `projects`.
permissions:
  contents: read   # checkout

# Serialised so the newest commit's :latest is written last. Not cancelled: cancelling would
# skip the intermediate commit's :<sha> image and leave a hole in the rollback tags.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Outer bound over the 20-minute step; it must exceed the sum, because act_runner kills the
    # whole job when this fires and the cleanup step would not run.
    timeout-minutes: 25
    # Job-level so the create and cleanup steps cannot disagree about the name; the run id
    # keeps concurrent runs on the shared daemon apart.
    env:
      TEST_NAME: airdrop-checker-tests-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python`: setup actions are not verified on this self-hosted runner and
      # can silently check nothing. Running inside a container on the same docker the build
      # uses makes "the tests ran" and "docker works" the same statement.
      timeout-minutes: 20
      env:
        # The same interpreter the Dockerfile ships; requirements-dev.txt pins pytest 8.4.x
        # because pytest 9 requires python >= 3.10.
        RUNTIME_IMAGE: python:3.9-slim
      # This `run:` body is byte-identical to the one in tests.yml.
      run: |
        set -e
        set -o pipefail
        # A UI re-run reuses github.run_id, so a killed attempt's container may still hold the
        # name; `docker run --name` would fail on the conflict. `-v` drops anonymous volumes.
        docker rm -f -v "$TEST_NAME" || true
        # The workspace goes in as a tar over stdin, not a bind mount: this job runs inside
        # act_runner's container while `docker` talks to the host daemon, so `$PWD` means
        # something else (or nothing) on the host. It also keeps root-owned caches out of the
        # checkout. .dockerignore does not apply to a tar, so exclusions are listed here:
        # `.git` (unused), `.venv` (host wheels for another interpreter), `data/` (runtime
        # state on a workstation), `.env` (src/settings.py reads it via env_file, and a
        # workstation's holds real Grist credentials), and caches from another interpreter.
        # `--pull always`: the daemon is persistent, so a cached base would go stale.
        # The GRIST_* values are placeholders: all HTTP is mocked, tests/conftest.py
        # setdefault()s the same three, and `grist.invalid` (RFC 2606) cannot resolve.
        # `--name` makes the container reachable by the cleanup step: a step timeout kills the
        # docker CLI on the runner, not the container on the host, so `--rm` never fires.
        tar -cf - --exclude=./.git --exclude=./.venv --exclude=./data \
          --exclude=./.env --exclude=./.pytest_cache --exclude=__pycache__ . \
          | docker run --rm -i --pull always --name "$TEST_NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=test-doc \
          -e GRIST_API_KEY=test-key \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

    - name: Remove the test container from the runner
      # `always()`: this matters exactly when the step above failed or timed out and left the
      # container running on the shared daemon. Best-effort so a cleanup error cannot hide the
      # suite's verdict.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    # The runner is shared by the whole fleet. Step timeouts sum to 45 minutes (20 build + 10
    # smoke + 15 push); the outer bound must exceed that, because act_runner kills the whole
    # job when it fires and `if: always()` cleanups may not run.
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); any other ref (reachable via
      # workflow_dispatch) -> :<branch>. Never hardcode a fixed tag in the else branch: a side
      # branch would then overwrite the production tag.
      env:
        # Passed through the environment, not interpolated into the script: branch names may
        # contain `$`, backticks and parentheses, and the runner mounts the host docker socket.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in image paths, Gitea allows it in repo names.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest is pushed last and
          # only after its immutable :<sha> rollback twin made it to the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs one unambiguous tag; :<sha> can only mean this commit.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise into a legal docker tag ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal
          # characters become `-`, a bad first character becomes `_`, length is cut to 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch literally named `latest` would otherwise produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces. 20 minutes is far above a cold
      # build: python:3.9-slim, gosu, and pinned wheels (pydantic-core ships a cp39 manylinux
      # wheel, nothing is compiled); the image is about 147 MB.
      timeout-minutes: 20
      env:
        # Through the environment; `$TAGS` is a space-separated list and stays unquoted so
        # it word-splits into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted daemon is persistent, so a cached python:3.9-slim would go
        # stale; the EOL base only gets fixes as new digests behind the same tag. This is a
        # BuildKit build (the default since Engine 23.0), whose cache the final cleanup step
        # does not reclaim.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # Second gate, between build and push: a red smoke means nothing reaches the registry.
      #
      # It covers what only an assembled image can answer (see ci/smoke.py): every shipped
      # file compiles and imports under the image's python:3.9, PID 1 is `python main.py` as
      # uid 1000 (the entrypoint/gosu chain works), the loop writes its heartbeat,
      # .dockerignore kept tests/, ci/, .env and .venv out, a stripped environment dies naming
      # the missing variables, and the probe answers correctly in each of its three states.
      #
      # The container runs the image's own command: `--entrypoint` would also drop CMD, and
      # the ENTRYPOINT is what drops privileges.
      #
      # Docker's own health verdict is awaited; it is the only check that exercises the
      # Dockerfile's HEALTHCHECK line itself rather than the probe behind it.
      #
      # No production credential and no external API (Grist, purrfolio.com): a gate that
      # reddens on someone else's outage gets ignored.
      #
      # Nothing is published to the host; checks run via `docker exec`, and the name carries
      # the run id, so parallel runs on the shared daemon cannot collide.
      #
      # 10 minutes covers the worst case: up to 180 s for the first HEALTHCHECK verdict (60 s
      # interval), then ci/smoke.py — ~30 s for the heartbeat to appear, 40 s for it to move,
      # ten byte-compiles, thirteen imports, one 60 s startup run and three 30 s probe runs.
      # The margin matters: a run killed by the timeout loses the `docker logs` below.
      timeout-minutes: 10
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.smoke }}
        NAME: airdrop-checker-smoke-${{ github.run_id }}
      # This body is byte-identical to the one in tests.yml, comments included; only the
      # `env:` values above differ.
      run: |
        # A UI re-run keeps the same run_id, and an attempt killed by its timeout never
        # reaches the cleanup, so the name may still be taken.
        docker rm -f -v "$NAME" || true

        # Placeholder configuration, not credentials: `grist.invalid` (RFC 2606) fails on name
        # resolution, so no wallet list arrives and purrfolio.com is never called. It is needed
        # because the CMD is a direct `python main.py`, which exits within a second on a bare
        # environment; ci/smoke.py strips these again for its fail-loudly check.
        docker run -d --name "$NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=smoke-not-a-real-doc \
          -e GRIST_API_KEY=smoke-not-a-real-key \
          "$SMOKE_TAG"

        # Wait for docker's own health verdict: only this proves docker runs the probe (and the
        # right module path); a HEALTHCHECK that never goes green makes auto-heal restart the
        # container forever. "nohealth" means the image declares no HEALTHCHECK, which fails.
        # 90 attempts two seconds apart is 180 s, three 60 s intervals.
        attempt=0
        state=""
        health=""
        while [ "$attempt" -lt 90 ]; do
          info=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' "$NAME" 2>/dev/null) || info="gone gone"
          state=${info%% *}
          health=${info##* }
          if [ "$state" != "running" ]; then
            echo "container is '$state', not running; logs:"
            docker logs "$NAME" || true
            exit 1
          fi
          if [ "$health" = "nohealth" ]; then
            echo "the image declares no HEALTHCHECK at all — auto-heal would have nothing to act on"
            exit 1
          fi
          if [ "$health" = "healthy" ]; then
            break
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        if [ "$health" != "healthy" ]; then
          echo "container never became healthy (last verdict: '$health'); logs:"
          docker logs "$NAME"
          exit 1
        fi

        # Fed over stdin, so the image need not carry the script and it can be run by hand
        # against a local container. `-u` because stdout is a pipe: a step killed by the
        # timeout would otherwise lose the buffered `ok` lines.
        if ! docker exec -i "$NAME" python -u - < ci/smoke.py; then
          echo "smoke failed; container logs:"
          docker logs "$NAME"
          exit 1
        fi

    - name: Log in to the Gitea container registry
      # Logged in only after build and smoke, which run arbitrary code against the host's
      # docker.sock, so the credentials are not in the docker config during that stretch.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with `write:package`, an org secret on `projects`; a repo-level secret of the
        # same name would shadow it. GITEA_TOKEN has no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # Generous for a 147 MB image (the base layers travel too on a new digest); a tight
      # bound would abort a progressing push and leave :<sha> half-pushed with no :latest.
      timeout-minutes: 15
      env:
        # Same as in the build step: through the environment, `$TAGS` unquoted.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the smoke container from the runner
      # `always()`, and before the image cleanup: a leftover container on the shared daemon
      # would stay forever and pin the image, failing the `docker rmi` below.
      if: always()
      env:
        NAME: airdrop-checker-smoke-${{ github.run_id }}
      run: |
        docker rm -f -v "$NAME" || true

    - name: Remove the built images from the runner
      # Removes only this run's tags; `docker system prune` would hit other repos on the
      # shared daemon. The BuildKit cache (`docker builder prune`) and dangling old bases left
      # by `--pull` need a separate periodic cleanup on the runner host.
      if: always()
      env:
        # Same as in the build step: through the environment, `$TAGS` unquoted.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
