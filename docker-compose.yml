# Deploy REFERENCE. The real deployment is the `airdropchecker` service inside the
# multi-service `crypt-common` stack on nebula, managed through Portainer — this file
# documents what that service looks like on its own, and is what you would use to run
# the image standalone. Values below are PLACEHOLDERS (XXX), not real secrets.
#
# No inbound port, networks or volume: the checker only makes outbound calls and keeps
# no state (wallets and loop parameters live in Grist, the heartbeat in /tmp). Liveness
# comes from the image's HEALTHCHECK, which auto-heal acts on.

services:
  airdrop_checker:
    image: gitea.vvzvlad.xyz/projects/airdrop_checker:latest
    # Production's container name, without the underscore; renaming it is a production
    # change.
    container_name: airdropchecker
    # Load-bearing: a container with broken configuration exits, and this restarts it.
    restart: unless-stopped
    # The app runs as non-root `app` (uid 1000): the entrypoint starts as root, chowns
    # /app/data and drops privileges via gosu. A `user:` override here makes the
    # entrypoint skip the chown — the volume must then already be owned by that uid.
    security_opt:
      - no-new-privileges:true   # forbids privilege escalation via setuid binaries; gosu only drops privileges
    environment:
      GRIST_SERVER: XXX
      GRIST_DOC_ID: XXX
      GRIST_API_KEY: XXX
      TZ: Europe/Moscow
      # HEARTBEAT_FILE must be set HERE, never in .env: the loop reads it through
      # src/settings.py (which loads .env) and the probe reads the environment only.
      # HEARTBEAT_FILE: /tmp/airdrop_checker_heartbeat
      # HEARTBEAT_MAX_AGE: 1200
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # What production carries. Auto-update pulls a new :latest; auto-heal restarts the
      # container when the HEALTHCHECK reports a stale heartbeat.
      io.portainer.update.enable: "true"
      io.portainer.autoheal.enable: "true"
